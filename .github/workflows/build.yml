name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lite:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: macos-15-intel
            arch: x64
          - os: macos-15
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.3'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - name: Build Lite archives (full under 50 MB, code-only under 2 MB)
        run: npm run build:lite
      - name: Install isolated test browser (not included in release)
        run: npx playwright install chromium
      - name: Smoke-test delivered Lite launchers and browser lifecycle
        run: npm run smoke:lite
      - name: Publish universal code-only archive from Windows job only
        if: runner.os != 'Windows'
        run: python -c "import pathlib; [p.unlink() for p in pathlib.Path('dist').glob('*code-only.zip')]"
      - name: Create checksums
        run: node scripts/checksums.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: Kimi-Relay-Lite-${{ runner.os }}-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/SHA256SUMS-*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: lite
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/publish.py
