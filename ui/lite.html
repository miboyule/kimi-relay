<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kimi Relay Lite · 轻量版</title><link rel="stylesheet" href="/lite.css"><script src="/lite.js" defer></script></head>
<body><main>
<div class="brand">⇄ &nbsp; Kimi Relay <span>Lite</span></div>
<h1>小一点，照样接力。</h1>
<p>使用自己的模型供应商，继续在 Kimi Work 工作。</p>
<section aria-label="网关状态"><div class="status"><i></i><strong id="status" role="status">正在连接本机网关…</strong></div>
<p id="detail">管理页可以关闭。网关继续运行，需要停止时请重新打开软件。</p>
<p id="connection" aria-live="polite"></p>
<a id="panel" class="primary" target="_blank" rel="noreferrer" hidden>打开设置 / 控制面板 ↗</a>
<div class="actions"><button data-action="setup">修改接入</button><button data-action="restart">重启网关</button><button data-action="stop">停止并退出</button></div>
</section>
<details><summary>更多选项</summary><div class="actions"><button data-action="data">打开数据目录</button><button data-action="remove-dns">撤销单域名解析</button></div></details>
<footer><p>中转站 API 余额不等于 Kimi 官方积分。工具不会给官方账号充值。</p>
<p>不修改 Kimi 安装文件 · 不自动安装开机服务 · 使用系统浏览器</p>
<a href="https://github.com/miboyule/kimi-relay" target="_blank" rel="noreferrer">说明与更新</a> · <a href="https://github.com/miboyule/kimi-relay/blob/main/docs/LITE.md" target="_blank" rel="noreferrer">轻量版使用与文件替换 / English</a></footer>
</main></body></html>
